name: Deploy to Cloudflare Pages

on:
  push:
    branches: [master]
  workflow_run:
    workflows: ["Snapshot Sync"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Stage site files
        run: |
          mkdir -p /tmp/cf_dist
          rsync -a --exclude='.git' --exclude='.github' ./ /tmp/cf_dist/
      - name: Generate build info
        run: |
          read -r sha ts < <(git log -1 --format='%H %ct')
          printf 'window.NOTES_BUILD={sha:"%s",time:%s*1000};\n' "$sha" "$ts" > /tmp/cf_dist/build-info.js
          sed -i -E "s#build-info\.js\?[^\"']*#build-info.js?v=$sha#" /tmp/cf_dist/index.html

      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy /tmp/cf_dist --project-name=encrypted-notes --branch=master --commit-dirty=true
