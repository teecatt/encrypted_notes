<html lang="zh-CN" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>编辑 · Encrypted Notes</title>
<script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljsDark" disabled onerror="this.remove()">

<style>
:root{--bg:#fff;--fg:#000;--muted:#6b6b6b;--line:#e5e5e5;--surface:#f4f4f4;--hover:#ebebeb;--code:#f6f6f6;--shadow:0 10px 40px rgba(0,0,0,.18)}
html.dark{--bg:#000;--fg:#fff;--muted:#9a9a9a;--line:#2e2e2e;--surface:#141414;--hover:#1e1e1e;--code:#111;--shadow:0 10px 40px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hidden{display:none!important}
svg{display:block}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted);flex:0 0 auto;text-decoration:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.only-mobile{display:none}
.i-moon{display:none}
html.dark .i-moon{display:block}
html.dark .i-sun{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{opacity:.85;background:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}

/* header */
.header{display:flex;align-items:center;gap:6px;height:50px;padding:0 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-size:14px;font-weight:700;white-space:nowrap}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:#eab308;flex:0 0 auto}
.spacer{flex:1 1 auto}
.desc-inline{width:170px;padding:7px 10px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:13px;outline:none}
.desc-inline:focus{border-color:var(--fg)}
@media(max-width:640px){.desc-inline{width:110px}}
#app{display:flex;flex-direction:column;height:100vh}

/* layout */
.layout{flex:1 1 auto;display:flex;min-height:0}
.sidebar{width:222px;flex:0 0 222px;border-right:1px solid var(--line);overflow-y:auto;padding:10px}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.nav-link{display:block;padding:6px 9px;border-radius:7px;font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.nav-link:hover{background:var(--hover);color:var(--fg)}
.nav-link.active{font-weight:600;color:var(--fg);background:var(--hover)}
.nav-tools{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:8px}
.ntbtn{width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;border-radius:7px;color:var(--muted)}
.ntbtn:hover{background:var(--hover);color:var(--fg)}
.ntbtn svg{width:17px;height:17px}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.tbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);transition:background .15s,color .15s}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tbtn svg{width:19px;height:19px}
.tsep{width:1px;height:20px;background:var(--line);margin:0 6px}

/* split */
.split{flex:1 1 auto;display:flex;min-height:0}
#ta{flex:1 1 50%;width:50%;min-width:0;resize:none;border:0;border-right:1px solid var(--line);outline:none;background:var(--surface);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.75;padding:16px;tab-size:2}
.preview{flex:1 1 50%;width:50%;min-width:0;overflow:auto;padding:16px 22px 60px;overflow-wrap:anywhere;word-break:break-word}

/* status */
.status{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex:0 0 auto}
.status .msg{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{color:#22c55e}.warn{color:#eab308}.err{color:#e5484d}

/* markdown preview */
.preview h1{font-size:1.6em;margin:.6em 0 .5em;line-height:1.3}
.preview h2{font-size:1.3em;margin:1.4em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.preview h3{font-size:1.12em;margin:1.2em 0 .4em}
.preview p{margin:.7em 0}
.preview ul,.preview ol{padding-left:1.6em;margin:.7em 0}
.preview li{margin:.25em 0}
.preview a{text-decoration:underline;text-underline-offset:2px}
.preview img{max-width:100%;height:auto;border-radius:8px}
.preview hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.preview blockquote{border-left:3px solid var(--line);margin:1em 0;padding:.15em 0 .15em 1em;color:var(--muted)}
.preview code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:.1em .38em;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.preview pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;margin:1em 0}
.preview pre code{background:none;border:0;padding:0;font-size:.86em}
.preview table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92em;display:block;overflow-x:auto}
.preview th,.preview td{border:1px solid var(--line);padding:.45em .7em;text-align:left}
.preview thead th{background:var(--surface)}
.preview u{text-decoration:underline;text-underline-offset:2px}
.preview .placeholder{color:var(--muted)}
.preview .sync-flash{animation:flash 1s ease-out}
@keyframes flash{0%{background:var(--hover)}100%{background:transparent}}

@media(max-width:900px){
  .only-mobile{display:inline-flex}
  .sidebar{position:fixed;top:50px;left:0;z-index:40;height:calc(100vh - 50px);transform:translateX(-100%);transition:transform .22s;background:var(--bg);width:78vw;max-width:300px;flex:none}
  .sidebar.open{transform:translateX(0)}
  .split{flex-direction:column}
  #ta{width:100%;height:50%;border-right:0;border-bottom:1px solid var(--line)}
  .preview{width:100%;height:50%}
}
@media(min-width:901px){.scrim{display:none}}

/* center / overlays */
.center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.gate-card{width:100%;max-width:340px;border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.gate-card svg.big{width:44px;height:44px;margin:0 auto}
.pw-input{width:100%;margin-top:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;outline:none}
.pw-input:focus{border-color:var(--fg)}
html.dark .pw-input{background:#0d0d0d}
#gatePw{background:var(--bg);color:var(--fg)}
#gatePw::placeholder{color:var(--muted)}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card p{margin:.5em 0;font-size:13px;color:var(--muted)}
.card code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.1em .35em;font-size:.88em}
.setting{margin:14px 0}
.setting>label{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.setting .row{display:flex;align-items:center;gap:14px;font-size:14px}
.setting input[type=radio]{margin-right:5px}
#asSeconds{width:100%;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;outline:none}
#asSeconds:disabled{opacity:.45}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);z-index:95;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:rgba(20,20,20,.92);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
html.dark #toast{background:rgba(245,245,245,.94);color:#000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* timeline */
.timeline{margin-top:16px;padding-top:12px;border-top:1px solid var(--line)}
.tl-head{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:8px}
.tl-head svg{width:14px;height:14px}
.tl-empty{font-size:12px;color:var(--muted);padding:4px 2px;line-height:1.5}
.tl-item{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.tl-item:hover{background:var(--hover);color:var(--fg)}
.tl-item.sel{background:var(--fg);color:var(--bg)}
.tl-item.tl-base{border-top:1px dashed var(--line);margin-top:4px;padding-top:7px}
.tl-time{flex:0 0 auto}
.tl-meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* diff */
.diff-body{overflow:auto;flex:1 1 auto;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.65;padding:6px 0;min-height:120px}
.diff-line{white-space:pre-wrap;word-break:break-all;padding:0 10px}
.diff-add{background:rgba(34,197,94,.16)}
.diff-del{background:rgba(229,72,77,.16)}
.diff-sign{display:inline-block;width:1.1em;color:var(--muted);user-select:none}
</style>
</head>

<script type="module">
import * as S from './store.js';

const $ = id => document.getElementById(id);
let state=null, cloudNotes={}, meta={}, token='', currentId=null, dirty=false;

const escapeHtml=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* markdown */
function underlinePlugin(md){
  md.inline.ruler.after('emphasis','underline', function(state, silent){
    const start=state.pos, src=state.src;
    if(src.charCodeAt(start)!==0x2B || src.charCodeAt(start+1)!==0x2B) return false;
    const end=src.indexOf('++', start+2);
    if(end<0 || end===start+2) return false;
    if(!silent){ state.push('u_open','u',1); const t=state.push('text','',0); t.content=src.slice(start+2,end); state.push('u_close','u',-1); }
    state.pos=end+2; return true;
  });
}
let md=null;
if(window.markdownit){
  md=window.markdownit({html:false,linkify:true,typographer:true});
  md.use(underlinePlugin);
  const orig=md.renderer.render.bind(md.renderer);
  md.renderer.render=function(tokens,options,env){ for(const t of tokens){ if(t.map&&t.nesting===1) t.attrSet('data-line',String(t.map[0])); } return orig(tokens,options,env); };
  md.renderer.rules.fence=function(tokens,idx){
    const token=tokens[idx], info=(token.info||'').trim(), lang=info.split(/\s+/g)[0];
    let code;
    if(lang && window.hljs && hljs.getLanguage(lang)){ try{ code=hljs.highlight(token.content,{language:lang,ignoreIllegals:true}).value; }catch(e){ code=escapeHtml(token.content); } }
    else code=escapeHtml(token.content);
    const line=token.map?` data-line="${token.map[0]}"`:'';
    return `<pre${line} class="hljs"><code class="language-${escapeHtml(lang)}">${code}</code></pre>\n`;
  };
}
function renderMd(src){ if(md){ try{ return md.render(src); }catch(e){} } return '<pre style="white-space:pre-wrap">'+escapeHtml(src)+'</pre>'; }

/* toast / status */
let toastTimer=null;
function showToast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),4000); }
function setStatus(msg,cls){ const s=$('statusMsg'); s.textContent=msg||''; s.className='msg '+(cls||''); }

/* local key/token store (en-keys) */
const IDB_NAME='en-keys',IDB_STORE='keys',IDB_KEY='aes',IDB_TOKEN='token';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbPut(k,v){ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }

/* versions (timeline) */
const VDB='en-versions', VSTORE='v';
function vOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(VDB,1); r.onupgradeneeded=()=>{ r.result.createObjectStore(VSTORE,{keyPath:'id',autoIncrement:true}); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function vAdd(rec){ const db=await vOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(VSTORE,'readwrite').objectStore(VSTORE).add(rec); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }
async function vAll(){ try{ const db=await vOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(VSTORE,'readonly').objectStore(VSTORE).getAll(); q.onsuccess=()=>res(q.result||[]); q.onerror=()=>rej(q.error); }); }catch(e){ return []; } }
async function vClear(){ try{ const db=await vOpen(); await new Promise((res,rej)=>{ const tx=db.transaction(VSTORE,'readwrite'); tx.objectStore(VSTORE).clear(); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }catch(e){} }
async function vDelete(ids){ if(!ids.length) return; try{ const db=await vOpen(); await new Promise((res,rej)=>{ const tx=db.transaction(VSTORE,'readwrite'); const os=tx.objectStore(VSTORE); ids.forEach(i=>os.delete(i)); tx.oncomplete=()=>res(); tx.onerror=()=>rej(tx.error); }); }catch(e){} }
let versions=[], selectedVersions=new Set();
const REASON_LABEL={draft:'定时缓存', blur:'焦点改变', background:'切入后台', switch:'切换笔记', sync:'同步'};
function reasonLabel(r){ return REASON_LABEL[r]||r||''; }
function fmtClock(ts){ return new Date(ts).toLocaleTimeString('zh-CN',{hour12:false}); }
async function loadVersions(){ versions=(await vAll()).sort((a,b)=>b.id-a.id); renderTimeline(); }
async function snapshot(reason){
  if(!state || !currentId) return;
  const content=$('ta').value;
  const latest=versions.find(v=>v.noteId===currentId);
  const baseline=latest?latest.content:((cloudNotes[currentId]&&cloudNotes[currentId].content)||'');
  if(content===baseline) return;
  const now=Date.now();
  const id=await vAdd({ts:now,noteId:currentId,content,reason});
  versions.unshift({id,ts:now,noteId:currentId,content,reason});
  while(versions.length>50){ const old=versions.pop(); vDelete([old.id]); }
  renderTimeline();
}
function baseContentFor(noteId){
  const nv=versions.filter(v=>v.noteId===noteId).sort((a,b)=>a.id-b.id);
  if(nv.length) return nv[0].content;
  return (cloudNotes[noteId]&&cloudNotes[noteId].content)||'';
}
function baseLabelFor(noteId){ return versions.some(v=>v.noteId===noteId)?'最早本地版本':'云端版本'; }
function renderTimeline(){
  const el=$('timeline'); if(!el) return;
  el.innerHTML='';
  $('tlCount').textContent=versions.length?('('+versions.length+')'):'';
  if(!versions.length){ el.innerHTML='<div class="tl-empty">暂无本地版本（有改动时自动记录；推送成功后清空）</div>'; return; }
  for(const v of versions){
    const row=document.createElement('div'); row.className='tl-item'+(selectedVersions.has(v.id)?' sel':''); row.dataset.id=v.id;
    const t=document.createElement('span'); t.className='tl-time'; t.textContent=fmtClock(v.ts);
    const m=document.createElement('span'); m.className='tl-meta'; m.textContent=(v.noteId||'')+' · '+reasonLabel(v.reason);
    row.appendChild(t); row.appendChild(m); attachLongPress(row,v.id); el.appendChild(row);
  }
  if(currentId){
    const baseRow=document.createElement('div'); baseRow.className='tl-item tl-base';
    const bt=document.createElement('span'); bt.className='tl-time'; bt.textContent='基';
    const bm=document.createElement('span'); bm.className='tl-meta'; bm.textContent=baseLabelFor(currentId)+' · 点击对比当前';
    baseRow.appendChild(bt); baseRow.appendChild(bm);
    baseRow.onclick=()=>openDiff(baseContentFor(currentId), $('ta').value, '基（'+baseLabelFor(currentId)+'）', '当前编辑器');
    el.appendChild(baseRow);
  }
}
function attachLongPress(row,id){
  let timer=null, longPressed=false;
  const start=()=>{ longPressed=false; timer=setTimeout(()=>{ longPressed=true; toggleSelect(id,!selectedVersions.has(id)); },500); };
  const cancel=()=>{ if(timer){ clearTimeout(timer); timer=null; } };
  row.addEventListener('pointerdown',start);
  row.addEventListener('pointerup',()=>{ cancel(); if(!longPressed) showVersionDiff(id); });
  row.addEventListener('pointerleave',cancel);
  row.addEventListener('pointercancel',cancel);
  row.addEventListener('contextmenu',e=>e.preventDefault());
}
function toggleSelect(id,on){ if(on) selectedVersions.add(id); else selectedVersions.delete(id); renderTimeline(); if(selectedVersions.size===2) showSelectedDiff(); }
function showVersionDiff(id){
  const cur=versions.find(v=>v.id===id); if(!cur) return;
  openDiff(baseContentFor(cur.noteId), cur.content, '基（'+baseLabelFor(cur.noteId)+'）', fmtClock(cur.ts));
}
function showSelectedDiff(){
  const arr=[...selectedVersions].map(id=>versions.find(v=>v.id===id)).filter(Boolean).sort((a,b)=>a.id-b.id);
  if(arr.length!==2) return;
  openDiff(arr[0].content, arr[1].content, fmtClock(arr[0].ts), fmtClock(arr[1].ts));
}
function diffLines(a,b){
  const A=String(a).split('\n'), B=String(b).split('\n'), n=A.length, m=B.length;
  if(n*m>2000000){ const out=[]; for(let i=0;i<n;i++) out.push({t:'-',s:A[i]}); for(let j=0;j<m;j++) out.push({t:'+',s:B[j]}); return out; }
  const dp=[]; for(let i=0;i<=n;i++) dp.push(new Int32Array(m+1));
  for(let i=n-1;i>=0;i--) for(let j=m-1;j>=0;j--) dp[i][j]=A[i]===B[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[]; let i=0,j=0;
  while(i<n&&j<m){ if(A[i]===B[j]){ out.push({t:' ',s:A[i]}); i++; j++; } else if(dp[i+1][j]>=dp[i][j+1]){ out.push({t:'-',s:A[i]}); i++; } else { out.push({t:'+',s:B[j]}); j++; } }
  while(i<n) out.push({t:'-',s:A[i++]});
  while(j<m) out.push({t:'+',s:B[j++]});
  return out;
}
function openDiff(base,latest,baseLabel,latestLabel){
  $('diffLabels').textContent=baseLabel+' → '+latestLabel;
  const body=$('diffBody'); body.innerHTML='';
  for(const l of diffLines(base,latest)){
    const d=document.createElement('div'); d.className='diff-line'+(l.t==='+'?' diff-add':l.t==='-'?' diff-del':'');
    const sign=document.createElement('span'); sign.className='diff-sign'; sign.textContent=l.t===' '?' ':l.t;
    d.appendChild(sign); d.appendChild(document.createTextNode(l.s)); body.appendChild(d);
  }
  $('diffModal').classList.remove('hidden');
}
$('diffClose').onclick=()=>$('diffModal').classList.add('hidden');

/* draft cache */
function draftKey(id){ return 'en-draft:'+id; }
function loadDraft(id){ try{ const d=JSON.parse(localStorage.getItem(draftKey(id))||'null'); return d&&typeof d.c==='string'?d:null; }catch(e){ return null; } }
function clearDraft(id){ try{ localStorage.removeItem(draftKey(id)); }catch(e){} }
let autosaveCfg=loadCfg();
function loadCfg(){ try{ const c=JSON.parse(localStorage.getItem('en-autosave')||'{}'); return {mode:(c.mode==='timeout'?'timeout':'blur'),seconds:Math.min(86400,Math.max(1,parseInt(c.seconds,10)||30)),skipDesc:!!c.skipDesc}; }catch(e){ return {mode:'blur',seconds:30,skipDesc:false}; } }
function saveCfg(c){ autosaveCfg=c; try{ localStorage.setItem('en-autosave',JSON.stringify(c)); }catch(e){} }
function applySaveUI(){ const el=$('descInline'); if(el) el.classList.toggle('hidden',!autosaveCfg.skipDesc); }
let autosaveTimer=null;
function cancelAutosave(){ if(autosaveTimer){ clearTimeout(autosaveTimer); autosaveTimer=null; } }
function scheduleAutosave(){ if(autosaveCfg.mode==='blur') return; cancelAutosave(); autosaveTimer=setTimeout(()=>{ autosaveTimer=null; saveDraft(); snapshot('draft'); },autosaveCfg.seconds*1000); }
function saveDraft(){
  if(!state||!currentId) return;
  const content=$('ta').value;
  const saved=(cloudNotes[currentId]&&cloudNotes[currentId].content)||'';
  if(content===saved){ clearDraft(currentId); updateAutosaveInfo(); return; }
  try{ localStorage.setItem(draftKey(currentId),JSON.stringify({c:content,t:Date.now()})); }catch(e){}
  updateAutosaveInfo();
}
function updateAutosaveInfo(msg){
  const el=$('autosaveInfo');
  if(msg){ el.textContent=msg; return; }
  const d=loadDraft(currentId);
  el.textContent=d?('草稿缓存于 '+fmtClock(d.t)):(autosaveCfg.mode==='blur'?'失焦缓存':'定时 '+autosaveCfg.seconds+'s');
}

/* render throttle + preview scroll sync */
let lastRender=0, renderTimer=null;
function scheduleRender(){ const now=Date.now(); if(now-lastRender>=1000){ doRender(); return; } if(!renderTimer){ renderTimer=setTimeout(()=>{ renderTimer=null; doRender(); },1000-(now-lastRender)); } }
function doRender(){ lastRender=Date.now(); $('preview').innerHTML=renderMd($('ta').value)||'<p class="placeholder">（空）</p>'; syncPreviewFromCursor(); }
function updateStats(){ $('stats').textContent=$('ta').value.length+' 字符'; }
function cursorLine(){ const ta=$('ta'); return ta.value.slice(0,ta.selectionStart).split('\n').length-1; }
function topVisibleLine(){ const ta=$('ta'); const lh=parseFloat(getComputedStyle(ta).lineHeight)||24.5; return Math.floor(ta.scrollTop/lh); }
function scrollPreviewToLine(line){
  const pv=$('preview'); const nodes=pv.querySelectorAll('[data-line]'); let target=null;
  for(const n of nodes){ const l=parseInt(n.dataset.line,10); if(l<=line) target=n; else break; }
  if(!target) return;
  const top=target.getBoundingClientRect().top-pv.getBoundingClientRect().top+pv.scrollTop;
  pv.scrollTop=Math.max(0,top-8);
}
function syncPreviewFromCursor(){ if($('preview').querySelector('[data-line]')) scrollPreviewToLine(cursorLine()); }
function onInput(){ markDirty(true); scheduleRender(); scheduleAutosave(); updateStats(); }
function markDirty(v){ dirty=v; $('dirtyDot').classList.toggle('hidden',!v); }
$('ta').addEventListener('input',onInput);
$('ta').addEventListener('click',syncPreviewFromCursor);
$('ta').addEventListener('keyup',e=>{ if(e.key.length>1||e.key==='Enter'||e.key==='ArrowUp'||e.key==='ArrowDown') syncPreviewFromCursor(); });
$('ta').addEventListener('scroll',()=>{ if($('preview').querySelector('[data-line]')) scrollPreviewToLine(topVisibleLine()); });
$('ta').addEventListener('blur',()=>{ if(autosaveCfg.mode==='blur'){ saveDraft(); snapshot('blur'); } });

/* data model */
function stateToNotes(){
  const out={};
  (function walk(nodes,anc){
    (nodes||[]).forEach((n,i)=>{
      out[n.id]={id:n.id,title:n.title,content:(state.pages&&state.pages[n.id])||'',order:i,ancestors:anc.slice()};
      if(n.children) walk(n.children,anc.concat([n.id]));
    });
  })(state.nav,[]);
  return out;
}
function applyNotes(notes){ state={nav:S.buildNav(notes),pages:{}}; Object.values(notes).forEach(n=>{ state.pages[n.id]=n.content||''; }); }

/* nav */
function renderNav(){
  const nav=$('nav'); nav.innerHTML='';
  if(!state||!state.nav) return;
  const add=(items,depth)=>{
    for(const it of items){
      const a=document.createElement('div'); a.className='nav-link'+(it.id===currentId?' active':''); a.dataset.id=it.id;
      a.style.paddingLeft=(9+depth*14)+'px'; a.textContent=it.title;
      a.onclick=()=>{ selectNote(it.id); closeSidebar(); };
      nav.appendChild(a);
      if(it.children) add(it.children,depth+1);
    }
  };
  add(state.nav,0);
}
function closeSidebar(){ $('sidebar').classList.remove('open'); $('scrim').classList.remove('show'); }
$('menu').onclick=()=>{ $('sidebar').classList.toggle('open'); $('scrim').classList.toggle('show'); };
$('scrim').onclick=closeSidebar;

/* nav editing */
function findNode(nodes,id,parent){
  for(let i=0;i<nodes.length;i++){
    const n=nodes[i];
    if(n.id===id) return {node:n,list:nodes,index:i,parent};
    if(n.children){ const r=findNode(n.children,id,n); if(r) return r; }
  }
  return null;
}
function afterStructureChange(){ markDirty(true); renderNav(); renderTimeline(); updateStats(); }
$('ntNew').onclick=()=>{
  const title=prompt('新笔记标题：','新笔记'); if(title===null) return;
  const id=S.newId(), node={title:title.trim()||'新笔记',id};
  const ref=currentId?findNode(state.nav,currentId):null;
  if(ref) ref.list.splice(ref.index+1,0,node); else state.nav.push(node);
  state.pages[id]='';
  afterStructureChange(); selectNote(id,true); markDirty(true);
};
$('ntChild').onclick=()=>{
  if(!currentId) return;
  const title=prompt('子笔记标题：','子笔记'); if(title===null) return;
  const ref=findNode(state.nav,currentId); if(!ref) return;
  const id=S.newId(), node={title:title.trim()||'子笔记',id};
  if(!ref.node.children) ref.node.children=[];
  ref.node.children.push(node); state.pages[id]='';
  afterStructureChange(); selectNote(id,true); markDirty(true);
};
$('ntRename').onclick=()=>{
  if(!currentId) return;
  const ref=findNode(state.nav,currentId); if(!ref) return;
  const title=prompt('重命名：',ref.node.title); if(title===null) return;
  ref.node.title=title.trim()||ref.node.title; afterStructureChange();
};
$('ntDelete').onclick=()=>{
  if(!currentId) return;
  const ref=findNode(state.nav,currentId); if(!ref) return;
  if(!confirm('删除「'+ref.node.title+'」？（子笔记会上移保留）')) return;
  const kids=ref.node.children||[];
  ref.list.splice(ref.index,1,...kids);
  delete state.pages[ref.node.id];
  afterStructureChange();
  const first=state.nav[0]&&state.nav[0].id;
  if(first){ selectNote(first,true); markDirty(true); } else { currentId=null; renderNav(); renderTimeline(); markDirty(true); }
};
function moveNode(dir){
  if(!currentId) return;
  const ref=findNode(state.nav,currentId); if(!ref) return;
  const ni=ref.index+dir; if(ni<0||ni>=ref.list.length) return;
  const [n]=ref.list.splice(ref.index,1); ref.list.splice(ni,0,n); afterStructureChange();
}
$('ntUp').onclick=()=>moveNode(-1);
$('ntDown').onclick=()=>moveNode(1);
$('ntIndent').onclick=()=>{
  if(!currentId) return;
  const ref=findNode(state.nav,currentId); if(!ref||ref.index===0) return;
  const prev=ref.list[ref.index-1]; const [n]=ref.list.splice(ref.index,1);
  if(!prev.children) prev.children=[]; prev.children.push(n); afterStructureChange();
};
$('ntOutdent').onclick=()=>{
  if(!currentId) return;
  const ref=findNode(state.nav,currentId); if(!ref||!ref.parent) return;
  const parentRef=findNode(state.nav,ref.parent.id); if(!parentRef) return;
  const [n]=ref.list.splice(ref.index,1); parentRef.list.splice(parentRef.index+1,0,n); afterStructureChange();
};

/* note selection */
function selectNote(id,skipConfirm){
  if(!id){ currentId=null; $('ta').value=''; doRender(); return; }
  if(!state.pages[id]) id=state.nav[0]&&state.nav[0].id;
  if(!skipConfirm && dirty && currentId && !confirm('当前笔记有未保存的修改，仍要切换吗？')){ renderNav(); return; }
  if(currentId&&dirty){ saveDraft(); snapshot('switch'); }
  cancelAutosave();
  currentId=id;
  const draft=loadDraft(id), saved=(state.pages[id]||'');
  if(draft&&draft.c!==saved){ $('ta').value=draft.c; markDirty(true); showToast('已恢复未保存的草稿'); }
  else { $('ta').value=saved; markDirty(false); }
  renderNav(); renderTimeline(); doRender(); updateStats(); updateAutosaveInfo();
  history.replaceState(null,'','#'+id);
}

/* toolbar */
function surround(before,after){
  const ta=$('ta'),s=ta.selectionStart,e=ta.selectionEnd,sel=ta.value.slice(s,e);
  ta.setRangeText(before+sel+after,s,e,'end');
  const inner=s+before.length; ta.setSelectionRange(inner,inner+sel.length); ta.focus(); onInput();
}
function linePrefix(prefix){
  const ta=$('ta'),s=ta.selectionStart,e=ta.selectionEnd,val=ta.value;
  const start=val.lastIndexOf('\n',s-1)+1; let end=val.indexOf('\n',e); if(end<0) end=val.length;
  const out=val.slice(start,end).split('\n').map(l=>prefix+l).join('\n');
  ta.setRangeText(out,start,end,'end'); ta.setSelectionRange(start,start+out.length); ta.focus(); onInput();
}
function insertLink(img){
  const ta=$('ta'),s=ta.selectionStart,e=ta.selectionEnd;
  const sel=ta.value.slice(s,e)||(img?'alt':'text');
  const text=(img?'!':'')+'['+sel+'](url)';
  ta.setRangeText(text,s,e,'end');
  const at=s+text.lastIndexOf('(url)')+1; ta.setSelectionRange(at,at+3); ta.focus(); onInput();
}
const acts={
  bold:()=>surround('**','**'), italic:()=>surround('*','*'), underline:()=>surround('++','++'),
  strike:()=>surround('~~','~~'), code:()=>surround('`','`'),
  codeblock:()=>surround('```\n','\n```'), ul:()=>linePrefix('- '), ol:()=>linePrefix('1. '),
  quote:()=>linePrefix('> '), h2:()=>linePrefix('## '),
  hr:()=>{ const ta=$('ta'); ta.setRangeText('\n---\n',ta.selectionStart,ta.selectionEnd,'end'); ta.focus(); onInput(); },
  link:()=>insertLink(false), image:()=>insertLink(true)
};
$('toolbar').addEventListener('click',e=>{ const b=e.target.closest('[data-act]'); if(!b) return; const fn=acts[b.dataset.act]; if(fn) fn(); });

/* save / sync */
let saveResolver=null;
function askSave(needDesc,needToken){
  return new Promise(resolve=>{
    saveResolver=resolve;
    $('descField').classList.toggle('hidden',!needDesc);
    $('tokenField').classList.toggle('hidden',!needToken);
    $('saveDesc').value=''; $('tk').value='';
    $('saveModal').classList.remove('hidden');
    setTimeout(()=>{ (needDesc?$('saveDesc'):$('tk')).focus(); },50);
  });
}
$('saveForm').onsubmit=(e)=>{
  e.preventDefault();
  const needDesc=!$('descField').classList.contains('hidden');
  const needToken=!$('tokenField').classList.contains('hidden');
  const desc=needDesc?$('saveDesc').value.trim():'';
  const t=needToken?$('tk').value.trim():'';
  $('saveModal').classList.add('hidden');
  if(t) idbPut(IDB_TOKEN,t).catch(()=>{});
  if(saveResolver){ saveResolver({desc,token:t}); saveResolver=null; }
};
$('saveCancel').onclick=()=>{ $('saveModal').classList.add('hidden'); if(saveResolver){ saveResolver(null); saveResolver=null; } };

async function save(){
  if(!state){ showToast('尚未解锁或没有数据'); return; }
  const local=stateToNotes();
  const changed=[], removed=[];
  for(const id in local){
    const l=local[id], c=cloudNotes[id], m=meta[id];
    const same=c && l.title===c.title && l.content===c.content && l.order===c.order && m && m.path===S.notePath(id,l.ancestors);
    if(!same) changed.push(l);
  }
  for(const id in cloudNotes){ if(!local[id]) removed.push(id); }
  if(!changed.length && !removed.length){ showToast('没有更改，无需保存'); return; }
  let desc='';
  const needDesc=!autosaveCfg.skipDesc, needToken=!token;
  if(needDesc||needToken){
    const r=await askSave(needDesc,needToken);
    if(!r) return;
    desc=r.desc;
    if(needToken){ if(!r.token) return; token=r.token; }
  } else { desc=$('descInline').value.trim(); }
  $('btnSave').disabled=true; setStatus('加密并提交中…','warn');
  const base='update: '+changed.length+' 篇笔记 @ '+new Date().toISOString();
  const message=desc?base+'\n\n'+desc:base;
  try{
    for(const n of changed){
      const path=S.notePath(n.id,n.ancestors);
      const b64=await S.encryptText(S.packNote(n.order,n.title,n.content));
      const old=meta[n.id];
      const sha=await S.putNote(path,b64, old&&old.path===path?old.sha:null, token, message);
      if(old&&old.path&&old.path!==path){ try{ await S.deletePath(old.path,old.sha,token,message); }catch(e){} }
      meta[n.id]={sha,path};
    }
    for(const id of removed){
      const m=meta[id];
      if(m){ try{ await S.deletePath(m.path,m.sha,token,message); }catch(e){} delete meta[id]; }
    }
    // maintain structure manifest only when note paths changed
    try{
      const paths=Object.values(local).map(n=>S.notePath(n.id,n.ancestors)).sort();
      const man=await S.readManifest();
      const cur=man&&Array.isArray(man.notes)?man.notes.slice().sort():null;
      if(!cur || JSON.stringify(cur)!==JSON.stringify(paths)) await S.putManifest({v:1,notes:paths}, token, message);
    }catch(e){ console.warn('manifest 更新失败',e); }
    cloudNotes=local;
    await S.cachePut('state',state); await S.cachePut('meta',meta); await S.cachePut('cloud',cloudNotes);
    clearDraft(currentId); cancelAutosave(); markDirty(false); updateAutosaveInfo();
    if($('descInline')) $('descInline').value='';
    await vClear(); versions=[]; selectedVersions.clear(); renderTimeline();
    setStatus('已提交到远端','ok'); showToast('已保存到远端');
  }catch(e){ setStatus('✗ '+e.message,'err'); }
  finally{ $('btnSave').disabled=false; }
}
$('btnSave').onclick=save;

async function sync(){
  if(!state) return;
  $('btnSync').disabled=true; setStatus('拉取远端…','warn');
  try{
    const remote=await S.remoteNotes(token);
    const local=stateToNotes();
    const remoteIds=new Set(remote.map(e=>e.id));
    const merged=Object.assign({},local);
    const newCloud={};
    let pulled=0;
    for(const e of remote){
      const m=meta[e.id];
      let rp;
      if(m && m.sha===e.sha && m.path===e.path){
        rp=cloudNotes[e.id]||local[e.id]||{id:e.id,title:'',content:'',order:0,ancestors:S.ancestorsFromPath(e.path)};
      } else {
        const text=(await S.fetchNote(e.path)).trim();
        const p=S.parseNote(await S.decryptText(text));
        if(!p) continue;
        rp={id:e.id,title:p.title,content:p.content,order:p.order,ancestors:S.ancestorsFromPath(e.path)};
        meta[e.id]={sha:e.sha,path:e.path};
      }
      newCloud[e.id]=rp;
      const l=local[e.id], c=cloudNotes[e.id];
      const locallyChanged=l && c && (l.content!==c.content || l.title!==c.title || l.order!==c.order || JSON.stringify(l.ancestors)!==JSON.stringify(c.ancestors));
      if(locallyChanged){
        merged[e.id]=l;
        if(e.id===currentId && rp.content!==l.content) openDiff(rp.content,l.content,'远端(base)','本地(最新)');
      } else {
        merged[e.id]=rp;
      }
      if(JSON.stringify(l)!==JSON.stringify(rp)) pulled++;
    }
    for(const id in local){ if(!remoteIds.has(id)) merged[id]=local[id]; }
    cloudNotes=newCloud;
    applyNotes(merged);
    await S.cachePut('state',state); await S.cachePut('meta',meta); await S.cachePut('cloud',cloudNotes);
    selectNote(currentId||(state.nav[0]&&state.nav[0].id),true);
    setStatus(pulled?('已拉取 '+pulled+' 处更新'):'已是最新','ok');
    showToast(pulled?'已同步远端':'远端与本地一致');
  }catch(e){ setStatus('✗ '+e.message,'err'); }
  finally{ $('btnSync').disabled=false; }
}
$('btnSync').onclick=sync;

async function fullLoad(){
  const remote=await S.remoteNotes(token, true);
  const notes={};
  for(const e of remote){
    try{
      const p=S.parseNote(await S.decryptText((await S.fetchNote(e.path)).trim()));
      if(!p) continue;
      notes[e.id]={id:e.id,title:p.title,content:p.content,order:p.order,ancestors:S.ancestorsFromPath(e.path)};
      meta[e.id]={sha:/^[0-9a-f]{40}$/.test(e.sha||'')?e.sha:null, path:e.path};
    }catch(err){ console.warn('跳过',e.path,err); }
  }
  cloudNotes=JSON.parse(JSON.stringify(notes));
  applyNotes(notes);
  await S.cachePut('state',state); await S.cachePut('meta',meta); await S.cachePut('cloud',cloudNotes);
}

(async function(){
  try{
    await S.loadParams();
    const k=await idbGet(IDB_KEY);
    if(!k){ showGate(); return; }
    S.setKey(k);
    const t=await idbGet(IDB_TOKEN); if(t) token=t;
    const cmeta=await S.cacheGet('meta'); if(cmeta) meta=cmeta;
    const ccloud=await S.cacheGet('cloud'); if(ccloud) cloudNotes=ccloud;
    const cached=await S.cacheGet('state');
    if(cached && cached.nav){ state=cached; showEditor(); }
    else { try{ await fullLoad(); }catch(err){ console.warn('拉取失败',err); applyNotes({}); } showEditor(); }
  }catch(e){ console.warn(e); showGate(); }
})();
</script>
