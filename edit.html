</script>

<style>
:root{--bg:#fff;--fg:#000;--muted:#6b6b6b;--line:#e5e5e5;--surface:#f4f4f4;--hover:#ebebeb;--code:#f6f6f6;--shadow:0 10px 40px rgba(0,0,0,.18)}
html.dark{--bg:#000;--fg:#fff;--muted:#9a9a9a;--line:#2e2e2e;--surface:#141414;--hover:#1e1e1e;--code:#111;--shadow:0 10px 40px rgba(0,0,0,.6)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.7;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hidden{display:none!important}
svg{display:block}
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted);flex:0 0 auto;text-decoration:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.i-moon{display:none}
html.dark .i-moon{display:block}
html.dark .i-sun{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 16px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{opacity:.85;background:var(--fg)}
.btn:disabled{opacity:.5;cursor:default}

/* header */
.header{display:flex;align-items:center;gap:6px;height:50px;padding:0 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{font-size:14px;font-weight:700;white-space:nowrap}
.note-select{max-width:34vw;padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:13px;outline:none}
.dirty-dot{width:8px;height:8px;border-radius:50%;background:#eab308;flex:0 0 auto}
.spacer{flex:1 1 auto}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.tbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:var(--muted);transition:background .15s,color .15s}
.tbtn:hover{background:var(--hover);color:var(--fg)}
.tbtn svg{width:19px;height:19px}
.tsep{width:1px;height:20px;background:var(--line);margin:0 6px}

/* split */
.split{flex:1 1 auto;display:flex;min-height:0}
#ta{flex:1 1 50%;width:50%;min-width:0;resize:none;border:0;border-right:1px solid var(--line);outline:none;background:var(--surface);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.75;padding:16px;tab-size:2}
.preview{flex:1 1 50%;width:50%;min-width:0;overflow:auto;padding:16px 22px 60px}
@media(max-width:767px){
  .split{flex-direction:column}
  #ta{width:100%;height:50%;border-right:0;border-bottom:1px solid var(--line)}
  .preview{width:100%;height:50%}
  .note-select{max-width:30vw}
}

/* status */
.status{display:flex;align-items:center;gap:10px;height:34px;padding:0 12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);flex:0 0 auto}
.status .msg{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ok{color:#22c55e}.warn{color:#eab308}.err{color:#e5484d}

/* markdown preview */
.preview h1{font-size:1.6em;margin:.6em 0 .5em;line-height:1.3}
.preview h2{font-size:1.3em;margin:1.4em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.preview h3{font-size:1.12em;margin:1.2em 0 .4em}
.preview p{margin:.7em 0}
.preview ul,.preview ol{padding-left:1.6em;margin:.7em 0}
.preview li{margin:.25em 0}
.preview a{text-decoration:underline;text-underline-offset:2px}
.preview img{max-width:100%;height:auto;border-radius:8px}
.preview hr{border:0;border-top:1px solid var(--line);margin:1.6em 0}
.preview blockquote{border-left:3px solid var(--line);margin:1em 0;padding:.15em 0 .15em 1em;color:var(--muted)}
.preview code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:.1em .38em;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.preview pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;margin:1em 0}
.preview pre code{background:none;border:0;padding:0;font-size:.86em}
.preview table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92em;display:block;overflow-x:auto}
.preview th,.preview td{border:1px solid var(--line);padding:.45em .7em;text-align:left}
.preview thead th{background:var(--surface)}
.preview u{text-decoration:underline;text-underline-offset:2px}
.preview .placeholder{color:var(--muted)}

/* gate / overlay */
.center{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.gate-card{width:100%;max-width:340px;border:1px solid var(--line);border-radius:18px;padding:28px 24px;text-align:center}
.gate-card svg.big{width:44px;height:44px;margin:0 auto}
.pw-input{width:100%;margin-top:16px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;outline:none}
.pw-input:focus{border-color:var(--fg)}
html.dark .pw-input{background:#0d0d0d}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:400px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card p{margin:.5em 0;font-size:13px;color:var(--muted)}
.card code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.1em .35em;font-size:.88em}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);z-index:95;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:rgba(20,20,20,.92);color:#fff;font-size:13px;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
html.dark #toast{background:rgba(245,245,245,.94);color:#000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script type="module">
const PARAMS_URL = 'https://raw.githubusercontent.com/teecatt/encrypted_params/main/params.json';

const ARGON2_URL = new URL('vendor/argon2-bundled.min.js', location.href).href;
const $ = id => document.getElementById(id);
let params=null, aesKey=null, state=null, token='', currentId=null, dirty=false;

const bytesToB64 = b => { let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const b64ToBytes = s => { const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; };
const hexToBytes = h => { const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16); return a; };
const utf8ToB64  = s => bytesToB64(new TextEncoder().encode(s));
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

/* markdown-it + ++underline++ rule */
function underlinePlugin(md){
  md.inline.ruler.after('emphasis','underline', function(state, silent){
    const start=state.pos, src=state.src;
    if(src.charCodeAt(start)!==0x2B || src.charCodeAt(start+1)!==0x2B) return false;
    const end=src.indexOf('++', start+2);
    if(end<0 || end===start+2) return false;
    if(!silent){
      state.push('u_open','u',1);
      const t=state.push('text','',0); t.content=src.slice(start+2,end);
      state.push('u_close','u',-1);
    }
    state.pos=end+2;
    return true;
  });
}
let md=null;
if(window.markdownit){
  md = window.markdownit({html:false, linkify:true, typographer:true,
    highlight(str, lang){
      if(window.hljs && lang && hljs.getLanguage(lang)){
        try{ return '<pre class="hljs"><code>'+hljs.highlight(str,{language:lang,ignoreIllegals:true}).value+'</code></pre>'; }catch(e){}
      }
      return '<pre class="hljs"><code>'+escapeHtml(str)+'</code></pre>';
    }});
  md.use(underlinePlugin);
}
function renderMd(src){
  if(md){ try{ return md.render(src); }catch(e){} }
  return '<pre style="white-space:pre-wrap">'+escapeHtml(src)+'</pre>';
}

/* crypto */
async function loadParams(){ const r=await fetch(PARAMS_URL,{cache:'no-store'}); if(!r.ok) throw new Error('params 加载失败 '+r.status); params=await r.json(); }
let nobleArgon2id=null;
async function deriveKeyNoble(pw){
  if(!nobleArgon2id){ const mod=await import('https://cdn.jsdelivr.net/npm/@noble/hashes@2.4.0/argon2.js'); nobleArgon2id=mod.argon2id; }
  const raw=nobleArgon2id(new TextEncoder().encode(pw), hexToBytes(params.salt), {t:params.time,m:params.memKiB,p:params.parallelism,dkLen:params.hashLen});
  return await crypto.subtle.importKey('raw', raw, {name:'AES-CTR'}, false, ['encrypt','decrypt']);
}
function deriveKeyWasm(pw){
  return new Promise((resolve,reject)=>{
    let w;
    try{
      const code="importScripts("+JSON.stringify(ARGON2_URL)+");self.onmessage=async function(e){var d=e.data;try{var salt=new Uint8Array(d.saltHex.match(/../g).map(function(h){return parseInt(h,16)}));var res=await argon2.hash({pass:d.pass,salt:salt,time:d.t,mem:d.m,parallelism:d.p,hashLen:d.dkLen,type:2});var ck=await crypto.subtle.importKey('raw',res.hash,{name:'AES-CTR'},false,['encrypt','decrypt']);self.postMessage({ok:true,key:ck});}catch(err){self.postMessage({ok:false,error:String(err&&err.message||err)});}};";
      w=new Worker(URL.createObjectURL(new Blob([code],{type:'application/javascript'})));
    }catch(err){ return reject(err); }
    w.onmessage=(e)=>{w.terminate();e.data.ok?resolve(e.data.key):reject(new Error(e.data.error));};
    w.onerror=(e)=>{w.terminate();reject(new Error(e.message||'WASM worker error'));};
    w.postMessage({pass:pw,saltHex:params.salt,t:params.time,m:params.memKiB,p:params.parallelism,dkLen:params.hashLen});
  });
}
async function deriveKey(pw){ try{ return await deriveKeyWasm(pw); }catch(e){ console.warn('WASM 回退 JS：'+e.message); return await deriveKeyNoble(pw); } }
const IDB_NAME='en-keys',IDB_STORE='keys',IDB_KEY='aes',IDB_TOKEN='token';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbPut(k,v){ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
async function decryptToText(enc){
  const pt=new Uint8Array(await crypto.subtle.decrypt({name:'AES-CTR',counter:b64ToBytes(enc.iv),length:128}, aesKey, b64ToBytes(enc.ct)));
  return new TextDecoder('utf-8',{fatal:false}).decode(pt);
}
function interpretPlaintext(text){
  if(text.startsWith(params.magic)){ try{ return {state:JSON.parse(text.slice(params.magic.length)),garbage:null}; }catch(e){ return {state:null,garbage:text}; } }
  return {state:null,garbage:text};
}
async function encryptNotes(obj){
  const data=new TextEncoder().encode(params.magic+JSON.stringify(obj));
  const iv=crypto.getRandomValues(new Uint8Array(16));
  const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-CTR',counter:iv,length:128}, aesKey, data));
  return {v:1,alg:'AES-CTR-256',iv:bytesToB64(iv),ct:bytesToB64(ct)};
}
async function fetchNotes(){ const r=await fetch(NOTES_RAW+'?t='+Date.now(),{cache:'no-store'}); if(!r.ok) throw new Error('笔记加载失败 '+r.status); return await r.json(); }

/* toast / status */
let toastTimer=null;
function showToast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),4000); }
function setStatus(msg, cls){ const s=$('statusMsg'); s.textContent=msg||''; s.className='msg '+(cls||''); }

/* flatten nav */
function flatNav(items, depth, out){
  for(const it of items){ out.push({id:it.id,title:it.title,depth}); if(it.children) flatNav(it.children, depth+1, out); }
  return out;
}
function buildNoteList(){
  const sel=$('noteSelect'); sel.innerHTML='';
  for(const it of flatNav(state.nav||[],0,[])){
    const o=document.createElement('option'); o.value=it.id;
    o.textContent='\u00A0\u00A0'.repeat(it.depth)+(it.depth?'└ ':'')+it.title;
    sel.appendChild(o);
  }
}

/* preview + dirty */
let renderTimer=null;
function onInput(){
  markDirty(true);
  clearTimeout(renderTimer);
  renderTimer=setTimeout(renderPreview, 120);
  updateStats();
}
function renderPreview(){ $('preview').innerHTML = renderMd($('ta').value) || '<p class="placeholder">（空）</p>'; }
function updateStats(){ $('stats').textContent = $('ta').value.length+' 字符'; }
function markDirty(v){ dirty=v; $('dirtyDot').classList.toggle('hidden', !v); }

/* note selection */
function selectNote(id, skipConfirm){
  if(!state.pages[id]) id=state.nav[0].id;
  if(!skipConfirm && dirty && currentId && !confirm('当前笔记有未保存的修改，仍要切换吗？')){ $('noteSelect').value=currentId; return; }
  currentId=id;
  $('noteSelect').value=id;
  $('ta').value=state.pages[id]||'';
  markDirty(false);
  renderPreview(); updateStats();
  history.replaceState(null,'','#'+id);
}
$('noteSelect').onchange = () => selectNote($('noteSelect').value);

/* toolbar */
function surround(before, after){
  const ta=$('ta'), s=ta.selectionStart, e=ta.selectionEnd, sel=ta.value.slice(s,e);
  ta.setRangeText(before+sel+after, s, e, 'end');
  const inner=s+before.length;
  ta.setSelectionRange(inner, inner+sel.length);
  ta.focus(); onInput();
}
function linePrefix(prefix){
  const ta=$('ta'), s=ta.selectionStart, e=ta.selectionEnd, val=ta.value;
  const start=val.lastIndexOf('\n', s-1)+1;
  let end=val.indexOf('\n', e); if(end<0) end=val.length;
  const out=val.slice(start,end).split('\n').map(l=>prefix+l).join('\n');
  ta.setRangeText(out, start, end, 'end');
  ta.setSelectionRange(start, start+out.length);
  ta.focus(); onInput();
}
function insertLink(img){
  const ta=$('ta'), s=ta.selectionStart, e=ta.selectionEnd;
  const sel=ta.value.slice(s,e)||(img?'alt':'text');
  const text=(img?'!':'')+'['+sel+'](url)';
  ta.setRangeText(text, s, e, 'end');
  const at=s+text.lastIndexOf('(url)')+1;
  ta.setSelectionRange(at, at+3);
  ta.focus(); onInput();
}
const acts={
  bold:()=>surround('**','**'), italic:()=>surround('*','*'), underline:()=>surround('++','++'),
  strike:()=>surround('~~','~~'), code:()=>surround('`','`'),
  codeblock:()=>surround('```\n','\n```'), ul:()=>linePrefix('- '), ol:()=>linePrefix('1. '),
  quote:()=>linePrefix('> '), h2:()=>linePrefix('## '),
  hr:()=>{ const ta=$('ta'); ta.setRangeText('\n---\n', ta.selectionStart, ta.selectionEnd, 'end'); ta.focus(); onInput(); },
  link:()=>insertLink(false), image:()=>insertLink(true)
};
$('toolbar').addEventListener('click', e=>{
  const b=e.target.closest('[data-act]'); if(!b) return;
  const fn=acts[b.dataset.act]; if(fn) fn();
});

/* save */
let tokenResolver=null;
function askToken(){
  return new Promise(resolve=>{ tokenResolver=resolve; $('tk').value=''; $('tokenModal').classList.remove('hidden'); setTimeout(()=>$('tk').focus(),50); });
}
$('tokenForm').onsubmit=(e)=>{ e.preventDefault(); const t=$('tk').value.trim(); $('tokenModal').classList.add('hidden'); if(t) idbPut(IDB_TOKEN,t).catch(()=>{}); if(tokenResolver){ tokenResolver(t); tokenResolver=null; } };
$('tkCancel').onclick=()=>{ $('tokenModal').classList.add('hidden'); if(tokenResolver){ tokenResolver(''); tokenResolver=null; } };

async function save(){
  if(!state){ return; }
  if(!token){ token=await askToken(); if(!token) return; }
  state.pages[currentId]=$('ta').value;
  $('btnSave').disabled=true;
  setStatus('加密并提交中…','warn');
  try{
    const enc=await encryptNotes(state);
    const body=JSON.stringify(enc,null,2)+'\n';
    const auth={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
    const g=await fetch(API_URL+'?ref=dev&t='+Date.now(),{headers:auth});
    if(!g.ok){ if(g.status===401||g.status===403){ token=''; } throw new Error('读取文件信息失败 '+g.status+'（Token 无效或无权限）'); }
    const meta=await g.json();
    const put=await fetch(API_URL,{method:'PUT',headers:{...auth,'Content-Type':'application/json'},
      body:JSON.stringify({message:'update: '+currentId+' @ '+new Date().toISOString(),content:utf8ToB64(body),branch:'dev',sha:meta.sha})});
    const res=await put.json();
    if(!put.ok){ if(put.status===401||put.status===403){ token=''; } throw new Error(res.message||('提交失败 '+put.status)); }
    markDirty(false);
    setStatus('已提交到 dev：'+res.commit.sha.slice(0,7),'ok');
    showToast('已保存到 dev');
  }catch(e){
    setStatus('✗ '+e.message,'err');
  }finally{ $('btnSave').disabled=false; }
}
$('btnSave').onclick = save;
document.addEventListener('keydown', e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='s'){ e.preventDefault(); save(); }
});

/* theme */
(function(){
  const K='en-theme';
  const get=()=>localStorage.getItem(K)||'dark';
  const apply=p=>{ const d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark',d); const hl=$('hljsDark'); if(hl) hl.disabled=!d; };
  apply(get());
  $('theme-toggle').onclick=()=>{ const n=get()==='dark'?'light':'dark'; localStorage.setItem(K,n); apply(n); };
})();

window.addEventListener('beforeunload', e=>{ if(dirty){ e.preventDefault(); e.returnValue=''; } });
window.addEventListener('hashchange', ()=>{ const id=(location.hash||'').replace(/^#\/?/,''); if(state && id && id!==currentId) selectNote(id); });

/* gate unlock */
$('gateForm').onsubmit = async (e)=>{
  e.preventDefault();
  const pw=$('gatePw').value; if(!pw) return;
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true; $('gateMsg').textContent='正在解密…';
  try{
    if(!params) await loadParams();
    aesKey=await deriveKey(pw);
    const enc=await fetchNotes();
    const text=await decryptToText(enc);
    const r=interpretPlaintext(text);
    if(!r.state){ $('gateMsg').textContent='密码错误或数据损坏'; btn.disabled=false; return; }
    try{ await idbPut(IDB_KEY, aesKey); }catch(err){}
    state=r.state;
    const t=await idbGet(IDB_TOKEN); if(t) token=t;
    showEditor();
  }catch(err){ $('gateMsg').textContent='失败：'+err.message; btn.disabled=false; }
};

function showEditor(){
  $('gate').classList.add('hidden');
  $('app').classList.remove('hidden');
  buildNoteList();
  const id=(location.hash||'').replace(/^#\/?/,'') || state.nav[0].id;
  selectNote(id, true);
}

/* boot */
(async function(){
  try{
    if(!params) await loadParams();
    const k=await idbGet(IDB_KEY);
    if(!k){ $('gate').classList.remove('hidden'); return; }
    aesKey=k;
    const t=await idbGet(IDB_TOKEN); if(t) token=t;
    const enc=await fetchNotes();
    const text=await decryptToText(enc);
    const r=interpretPlaintext(text);
    if(!r.state){ $('gate').classList.remove('hidden'); return; }
    state=r.state;
    showEditor();
  }catch(e){ console.warn(e); $('gate').classList.remove('hidden'); }
})();
</script>
