<script type="module">
import { argon2id } from 'https://cdn.jsdelivr.net/npm/@noble/hashes@2.4.0/argon2.js';

const PARAMS_URL = 'https://raw.githubusercontent.com/teecatt/encrypted_params/main/params.json';
const NOTES_RAW  = 'https://raw.githubusercontent.com/teecatt/encrypted_notes/dev/notes.enc.json';
const API_URL    = 'https://api.github.com/repos/teecatt/encrypted_notes/contents/notes.enc.json';
const ARGON2_URL = new URL('vendor/argon2-bundled.min.js', location.href).href;

const $ = id => document.getElementById(id);
let params=null, aesKey=null, state=null, token='', currentId=null, dirty=false, garbageText=null, remembered=false;

const bytesToB64 = b => { let s=''; b.forEach(x=>s+=String.fromCharCode(x)); return btoa(s); };
const b64ToBytes = s => { const bin=atob(s); const a=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i); return a; };
const hexToBytes = h => { const a=new Uint8Array(h.length/2); for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16); return a; };
const utf8ToB64  = s => bytesToB64(new TextEncoder().encode(s));

const md = markdownit({
  html:false, linkify:true, typographer:true,
  highlight(str, lang){
    if(lang && hljs.getLanguage(lang)){
      try{ return '<pre class="hljs"><code>'+hljs.highlight(str,{language:lang,ignoreIllegals:true}).value+'</code></pre>'; }catch(e){}
    }
    return '<pre class="hljs"><code>'+str.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</code></pre>';
  }
});

async function loadParams(){
  const r = await fetch(PARAMS_URL, {cache:'no-store'});
  if(!r.ok) throw new Error('params 加载失败 '+r.status);
  params = await r.json();
}

async function deriveKeyNoble(pw){
  const salt = hexToBytes(params.salt);
  const raw = argon2id(new TextEncoder().encode(pw), salt, {t:params.time, m:params.memKiB, p:params.parallelism, dkLen:params.hashLen});
  return await crypto.subtle.importKey('raw', raw, {name:'AES-CTR'}, false, ['encrypt','decrypt']);
}
function deriveKeyWasm(pw){
  return new Promise((resolve,reject)=>{
    let w;
    try{
      const code =
        "importScripts("+JSON.stringify(ARGON2_URL)+");"+
        "self.onmessage=async function(e){var d=e.data;try{"+
        "var salt=new Uint8Array(d.saltHex.match(/../g).map(function(h){return parseInt(h,16)}));"+
        "var res=await argon2.hash({pass:d.pass,salt:salt,time:d.t,mem:d.m,parallelism:d.p,hashLen:d.dkLen,type:2});"+
        "var ck=await crypto.subtle.importKey('raw',res.hash,{name:'AES-CTR'},false,['encrypt','decrypt']);"+
        "self.postMessage({ok:true,key:ck});"+
        "}catch(err){self.postMessage({ok:false,error:String(err&&err.message||err)});}};";
      const url=URL.createObjectURL(new Blob([code],{type:'application/javascript'}));
      w=new Worker(url);
    }catch(err){ return reject(err); }
    w.onmessage=(e)=>{w.terminate();e.data.ok?resolve(e.data.key):reject(new Error(e.data.error));};
    w.onerror=(e)=>{w.terminate();reject(new Error(e.message||'WASM worker error'));};
    w.postMessage({pass:pw,saltHex:params.salt,t:params.time,m:params.memKiB,p:params.parallelism,dkLen:params.hashLen});
  });
}
let lastEngine='';
async function deriveKey(pw){
  try{ const k=await deriveKeyWasm(pw); lastEngine='wasm'; return k; }
  catch(e){ console.warn('WASM 解密失败，回退纯 JS：'+e.message); lastEngine='js'; return await deriveKeyNoble(pw); }
}

/* ── 本机存储（IndexedDB：不可导出 CryptoKey + GitHub Token） ── */
const IDB_NAME='en-keys', IDB_STORE='keys', IDB_KEY='aes', IDB_TOKEN='token';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>{ r.result.createObjectStore(IDB_STORE); }; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbPut(k,v){ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
async function idbDel(k){ try{ const db=await idbOpen(); await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }catch(e){} }

async function decryptToText(enc){
  const iv = b64ToBytes(enc.iv), ct = b64ToBytes(enc.ct);
  const pt = new Uint8Array(await crypto.subtle.decrypt({name:'AES-CTR', counter:iv, length:128}, aesKey, ct));
  return new TextDecoder('utf-8', {fatal:false}).decode(pt);
}
function interpretPlaintext(text){
  if(text.startsWith(params.magic)){
    try{ return {state: JSON.parse(text.slice(params.magic.length)), garbage:null}; }
    catch(e){ return {state:null, garbage:text}; }
  }
  return {state:null, garbage:text};
}
async function encryptNotes(obj){
  const data = new TextEncoder().encode(params.magic + JSON.stringify(obj));
  const iv = crypto.getRandomValues(new Uint8Array(16));
  const ct = new Uint8Array(await crypto.subtle.encrypt({name:'AES-CTR', counter:iv, length:128}, aesKey, data));
  return {v:1, alg:'AES-CTR-256', iv:bytesToB64(iv), ct:bytesToB64(ct)};
}

async function fetchNotes(){
  const r = await fetch(NOTES_RAW + '?t=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('笔记加载失败 '+r.status);
  return await r.json();
}

function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function renderNav(){
  const nav=$('nav'); nav.innerHTML='';
  if(!state || !state.nav) return;
  const add = (items, depth) => {
    for(const it of items){
      const a=document.createElement('a');
      a.href='#'+it.id; a.dataset.id=it.id;
      a.className='block py-1.5 rounded hover:bg-surface-light dark:hover:bg-surface-dark text-muted-light dark:text-muted-dark';
      a.style.paddingLeft=(8+depth*14)+'px';
      a.textContent=it.title;
      if(it.id===currentId) a.classList.add('nav-active');
      nav.appendChild(a);
      if(it.children) add(it.children, depth+1);
    }
  };
  add(state.nav, 0);
}

function showGarbage(text){
  $('pageTitle').textContent='';
  $('content').innerHTML='<pre class="whitespace-pre-wrap break-all text-xs leading-relaxed">'+escapeHtml(text)+'</pre>';
  renderNav();
}

function renderPage(id){
  if(!state || !state.pages){ showGarbage(garbageText||''); return; }
  if(!state.pages[id]){ currentId=state.nav[0]?.id; id=currentId; }
  currentId=id;
  $('pageTitle').textContent = state.pages[id] ? id : '';
  $('content').innerHTML = md.render(state.pages[id] || '*(空)*');
  renderNav();
}

let lastMs=parseInt(localStorage.getItem('en_last_ms')||'0',10)||0;
function updateMode(){
  const parts=[token?'可编辑 · 保存时提交到 dev':'保存时输入 Token 即可提交'];
  if(token) parts.push('Token 已存本机');
  if(remembered) parts.push('密钥已存本机');
  if(lastMs) parts.push('上次解密 '+lastMs+' ms');
  $('modeInfo').textContent=parts.join(' · ');
}
let toastTimer=null;
function showToast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.remove('hidden');
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.add('hidden'),4500);
}
function setDebug(dbg){
  const eng = lastEngine==='wasm' ? 'WASM（快）' : lastEngine==='js' ? '纯 JS（慢，回退）' : '?';
  $('debug').textContent =
    '引擎  '+eng+'\n'+
    '参数  '+dbg.params+' ms\n'+
    '密钥  '+dbg.derive+' ms\n'+
    '拉取  '+dbg.fetch+' ms\n'+
    'AES   '+dbg.decrypt+' ms\n'+
    '实际  '+dbg.work+' ms';
  console.log('[解密耗时]', dbg, 'engine='+lastEngine);
}
function enterApp(){
  if(state && state.nav){
    const id=(location.hash||'').replace(/^#\/?/,'') || state.nav[0].id;
    renderPage(id);
  } else { renderPage(null); }
}
function showApp(dbg){
  $('unlock').classList.add('hidden');
  $('app').classList.remove('hidden');
  if(dbg){
    lastMs=dbg.work;
    showToast('✓ 已解密 · '+dbg.work+' ms');
    setDebug(dbg);
  }
  updateMode();
}

/* ── unlock ── */
$('unlockForm').onsubmit = async (e) => {
  e.preventDefault();
  const pw=$('pw').value;
  if(!pw){ $('unlockMsg').textContent='请输入密码'; $('unlockMsg').className='text-xs mt-2 text-red-500'; return; }
  $('btnUnlock').disabled=true; $('pw').disabled=true;
  $('unlockMsg').textContent='';
  $('arrowIcon').style.display='none';
  $('spinIcon').style.display='inline-block';
  $('unlockStatus').classList.remove('hidden');
  const setStatus=(t)=>{ $('unlockStatus').textContent=t; };
  setStatus('Generate key…');
  const t0=performance.now();
  const dbg={params:0,derive:0,fetch:0,decrypt:0,work:0,total:0};
  const derivePromise=(async()=>{
    let a=performance.now();
    if(!params) await loadParams();
    dbg.params=performance.now()-a;
    a=performance.now();
    aesKey=await deriveKey(pw);
    dbg.derive=performance.now()-a;
    setStatus('Fetch ciphertext…');
    a=performance.now();
    const enc=await fetchNotes();
    dbg.fetch=performance.now()-a;
    a=performance.now();
    setStatus('AES decrypting…');
    const text=await decryptToText(enc);
    dbg.decrypt=performance.now()-a;
    const r=interpretPlaintext(text);
    state=r.state; garbageText=r.garbage;
    dbg.work=Math.round(performance.now()-t0);
    ['params','derive','fetch','decrypt'].forEach(k=>dbg[k]=Math.round(dbg[k]));
  })();
  derivePromise.catch(()=>{});
  try{
    await derivePromise;
    dbg.total=Math.round(performance.now()-t0);
    localStorage.setItem('en_last_ms', String(dbg.work));
    try{ await idbPut(IDB_KEY, aesKey); remembered=true; }catch(e){}
    showApp(dbg);
    enterApp();
  }catch(err){
    $('arrowIcon').style.display='';
    $('spinIcon').style.display='none';
    $('unlockStatus').classList.add('hidden');
    $('pw').disabled=false; $('btnUnlock').disabled=false;
    $('unlockMsg').textContent='解密失败：'+err.message;
    $('unlockMsg').className='text-xs mt-2 text-red-500';
  }
};

/* ── token prompt (only when editing) ── */
let tokenResolver=null;
function askToken(){
  return new Promise(resolve=>{
    tokenResolver=resolve;
    $('tk').value='';
    $('tokenModal').classList.remove('hidden');
    setTimeout(()=>$('tk').focus(),50);
  });
}
$('tokenForm').onsubmit=(e)=>{
  e.preventDefault();
  const t=$('tk').value.trim();
  $('tokenModal').classList.add('hidden');
  if(t){ idbPut(IDB_TOKEN,t).catch(()=>{}); }
  if(tokenResolver){ tokenResolver(t); tokenResolver=null; }
};
$('tkCancel').onclick=()=>{
  $('tokenModal').classList.add('hidden');
  if(tokenResolver){ tokenResolver(''); tokenResolver=null; }
};

/* ── edit / save ── */
$('btnEdit').onclick = () => {
  if(!state || !state.pages){ showToast('当前是乱码（密码可能不对），无法编辑'); return; }
  $('editId').textContent=currentId;
  $('editArea').value=state.pages[currentId]||'';
  $('saveMsg').textContent='';
  $('editor').classList.remove('hidden');
};
$('btnCancel').onclick = () => $('editor').classList.add('hidden');

$('btnSave').onclick = async () => {
  const text=$('editArea').value;
  if(!token){
    token = await askToken();
    if(!token){ return; }
    updateMode();
  }
  state.pages[currentId]=text;
  $('btnSave').disabled=true;
  $('saveMsg').textContent='加密并提交中…';
  $('saveMsg').className='px-4 py-2 text-xs border-t border-border-light dark:border-border-dark min-h-[32px] text-yellow-500';
  try{
    const enc=await encryptNotes(state);
    const body=JSON.stringify(enc,null,2)+'\n';
    const auth={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json'};
    const g=await fetch(API_URL+'?ref=dev&t='+Date.now(),{headers:auth});
    if(!g.ok){ if(g.status===401||g.status===403){ token=''; updateMode(); } throw new Error('读取文件信息失败 '+g.status+'（Token 无效或无权限）'); }
    const meta=await g.json();
    const put=await fetch(API_URL,{method:'PUT',headers:{...auth,'Content-Type':'application/json'},
      body:JSON.stringify({message:'update: '+currentId+' @ '+new Date().toISOString(),content:utf8ToB64(body),branch:'dev',sha:meta.sha})});
    const res=await put.json();
    if(!put.ok){ if(put.status===401||put.status===403){ token=''; updateMode(); } throw new Error(res.message||('提交失败 '+put.status)); }
    $('saveMsg').textContent='✓ 已提交到 dev：'+res.commit.sha.slice(0,7);
    $('saveMsg').className='px-4 py-2 text-xs border-t border-border-light dark:border-border-dark min-h-[32px] text-green-500';
    renderPage(currentId);
    setTimeout(()=>$('editor').classList.add('hidden'),700);
  }catch(e){
    $('saveMsg').textContent='✗ '+e.message;
    $('saveMsg').className='px-4 py-2 text-xs border-t border-border-light dark:border-border-dark min-h-[32px] text-red-500';
  }finally{ $('btnSave').disabled=false; }
};

$('btnReload').onclick = async () => {
  try{ const enc=await fetchNotes(); const text=await decryptToText(enc); const r=interpretPlaintext(text); state=r.state; garbageText=r.garbage; renderPage(currentId); }
  catch(e){ alert('刷新失败：'+e.message); }
};
$('btnLock').onclick = async () => { await idbDel(IDB_KEY); await idbDel(IDB_TOKEN); location.reload(); };
$('menu').onclick = () => $('sidebar').classList.toggle('hidden');

/* ── theme ── */
(function(){
  const K='en-theme';
  const get=()=>localStorage.getItem(K)||'dark';
  const apply=p=>{const d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme:dark)').matches);document.documentElement.classList.toggle('dark',d);document.querySelectorAll('[data-theme-icon]').forEach(e=>e.textContent=d?'light_mode':'dark_mode');};
  apply(get());
  ['theme-toggle','theme-toggle-lock'].forEach(id=>{const el=$(id); if(el) el.onclick=()=>{const n=get()==='dark'?'light':'dark';localStorage.setItem(K,n);apply(n);};});
})();

window.addEventListener('hashchange',()=>{ if(state) renderPage((location.hash||'').replace(/^#\/?/,'')); });

/* preload params + try auto-unlock with key stored on this device */
(async function autoUnlock(){
  try{
    if(!params) await loadParams();
    const k=await idbGet(IDB_KEY);
    if(!k) return;
    const t=await idbGet(IDB_TOKEN);
    if(t) token=t;
    aesKey=k; remembered=true;
    const enc=await fetchNotes();
    const text=await decryptToText(enc);
    const r=interpretPlaintext(text);
    state=r.state; garbageText=r.garbage;
    showApp(null);
    showToast('已用本机保存的密钥解锁');
    enterApp();
  }catch(e){ console.warn('自动解锁失败', e); }
})();
</script>
