<style>
:root{
  --bg:#ffffff; --fg:#000000; --muted:#6b6b6b; --line:#e5e5e5;
  --surface:#f4f4f4; --hover:#ebebeb; --code:#f6f6f6; --shadow:0 10px 40px rgba(0,0,0,.18);
}
html.dark{
  --bg:#000000; --fg:#ffffff; --muted:#9a9a9a; --line:#2e2e2e;
  --surface:#141414; --hover:#1e1e1e; --code:#111111; --shadow:0 10px 40px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.hidden{display:none!important}
svg{display:block}

/* ── icon buttons ── */
.icon-btn{width:38px;height:38px;display:inline-flex;align-items:center;justify-content:center;border-radius:9px;color:var(--muted);flex:0 0 auto;text-decoration:none;transition:background .15s,color .15s}
.icon-btn:hover{background:var(--hover);color:var(--fg)}
.icon-btn svg{width:20px;height:20px}
.only-mobile{display:inline-flex}
@media(min-width:1024px){.only-mobile{display:none!important}}

/* theme icon: dark→moon, light→sun */
.i-moon{display:none}
html.dark .i-moon{display:block}
html.dark .i-sun{display:none}

/* ── header ── */
.header{position:sticky;top:0;z-index:30;height:48px;display:flex;align-items:center;gap:2px;padding:0 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.brand{font-size:13px;font-weight:700;white-space:nowrap;padding:0 4px}
.page-title{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
.spacer{flex:1 1 auto}

/* ── layout ── */
.layout{display:flex;align-items:flex-start;min-height:calc(100vh - 48px)}
.sidebar{position:sticky;top:48px;width:264px;flex:0 0 264px;height:calc(100vh - 48px);overflow-y:auto;border-right:1px solid var(--line);padding:14px}
.side-foot{margin-top:20px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#debug{margin:10px 0 0;white-space:pre-wrap;word-break:break-all;font-size:11px;line-height:1.6;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.nav-link{display:block;padding:6px 9px;border-radius:7px;font-size:14px;color:var(--muted);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-link:hover{background:var(--hover);color:var(--fg)}
.nav-link.active{font-weight:600;color:var(--fg)}
.main{flex:1 1 auto;min-width:0}
.content{max-width:56rem;margin:0 auto;padding:32px 24px 88px;overflow-wrap:anywhere;word-break:break-word}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
@media(max-width:1023px){
  .sidebar{position:fixed;top:48px;left:0;z-index:40;height:calc(100vh - 48px);transform:translateX(-100%);transition:transform .22s;background:var(--bg);width:80vw;max-width:300px;flex:none}
  .sidebar.open{transform:translateX(0)}
  .content{padding:20px 16px 72px}
  .page-title{max-width:30vw}
}
@media(min-width:1024px){.scrim{display:none}}

/* ── markdown content ── */
.content h1{font-size:1.7em;line-height:1.3;margin:.6em 0 .5em}
.content h2{font-size:1.32em;line-height:1.35;margin:1.5em 0 .5em;padding-bottom:.25em;border-bottom:1px solid var(--line)}
.content h3{font-size:1.14em;margin:1.3em 0 .4em}
.content h4{font-size:1em;margin:1.1em 0 .3em}
.content p{margin:.75em 0}
.content ul,.content ol{padding-left:1.6em;margin:.75em 0}
.content li{margin:.25em 0}
.content a{text-decoration:underline;text-underline-offset:2px}
.content img{max-width:100%;height:auto;border-radius:8px}
.content hr{border:0;border-top:1px solid var(--line);margin:1.8em 0}
.content blockquote{border-left:3px solid var(--line);margin:1em 0;padding:.15em 0 .15em 1em;color:var(--muted)}
.content code{background:var(--code);border:1px solid var(--line);border-radius:5px;padding:.1em .38em;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.content pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow:auto;margin:1em 0}
.content pre code{background:none;border:0;padding:0;font-size:.86em}
.content table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.92em;display:block;overflow-x:auto}
.content th,.content td{border:1px solid var(--line);padding:.45em .7em;text-align:left}
.content thead th{background:var(--surface)}
.content input[type=checkbox]{margin-right:.4em}
.garbage{white-space:pre-wrap;word-break:break-all;overflow-wrap:anywhere;overflow-x:auto;max-width:100%;font-size:12px;line-height:1.65;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

/* ── unlock ── */
#unlock{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px}
.top-actions{position:fixed;top:10px;right:10px;z-index:60;display:flex;gap:2px}
.unlock-card{width:100%;max-width:320px;border:1px solid var(--line);border-radius:18px;background:var(--bg);padding:30px 24px;text-align:center}
.lock-badge{color:var(--fg)}
.lock-badge svg{width:44px;height:44px;margin:0 auto}
.pw-input{width:100%;margin-top:18px;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:14px;text-align:center;outline:none}
.pw-input:focus{border-color:var(--fg)}
html.dark .pw-input{background:#0d0d0d}
#pw{background:var(--bg);color:var(--fg)}
#pw::placeholder{color:var(--muted)}
.unlock-btn{width:52px;height:52px;margin:20px auto 0;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--fg);transition:border-color .15s}
.unlock-btn:hover{border-color:var(--fg)}
.unlock-btn svg{width:22px;height:22px}
.unlock-status{font-size:12px;color:var(--muted);margin-top:14px;min-height:16px}
.unlock-msg{font-size:12px;margin-top:8px;min-height:16px}
.spin{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--fg);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.err{color:#e5484d}

/* ── overlays / cards ── */
.overlay{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:20px}
.card{width:100%;max-width:420px;background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow)}
.card h2{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px}
.card p{margin:.6em 0;font-size:14px}
.card code{background:var(--surface);border:1px solid var(--line);border-radius:5px;padding:.1em .35em;font-size:.88em}
.card-actions{margin-top:18px;display:flex;justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 18px;border-radius:9px;font-size:14px;font-weight:600;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.btn:hover{background:var(--hover)}
.btn-primary{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn-primary:hover{opacity:.85;background:var(--fg)}

/* ── editor ── */
#editor{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.5);display:flex;justify-content:center}
.editor-card{width:100%;max-width:840px;background:var(--bg);display:flex;flex-direction:column;min-height:0}
.editor-head{display:flex;align-items:center;gap:8px;height:48px;padding:0 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.editor-title{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#editArea{flex:1 1 auto;width:100%;resize:none;padding:16px;border:0;outline:none;background:var(--surface);color:var(--fg);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;line-height:1.7}
#saveMsg{padding:8px 14px;font-size:12px;border-top:1px solid var(--line);min-height:32px;flex:0 0 auto}
@media(min-width:640px){
  #editor{padding:24px}
  .editor-card{border:1px solid var(--line);border-radius:16px;overflow:hidden;max-height:100%}
}

/* ── toast (Android-style, bottom-center, non-blocking) ── */
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(12px);z-index:95;max-width:calc(100vw - 32px);padding:10px 18px;border-radius:999px;background:rgba(20,20,20,.92);color:#fff;font-size:13px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .22s,transform .22s}
html.dark #toast{background:rgba(245,245,245,.94);color:#000}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

<script type="module">
import * as S from './store.js';

const $ = id => document.getElementById(id);
let state=null, currentId=null, token='', garbageMode=false, garbageIds=new Set();
const escapeHtml=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* markdown */
function underlinePlugin(md){
  md.inline.ruler.after('emphasis','underline', function(state, silent){
    const start=state.pos, src=state.src;
    if(src.charCodeAt(start)!==0x2B || src.charCodeAt(start+1)!==0x2B) return false;
    const end=src.indexOf('++', start+2);
    if(end<0 || end===start+2) return false;
    if(!silent){ state.push('u_open','u',1); const t=state.push('text','',0); t.content=src.slice(start+2,end); state.push('u_close','u',-1); }
    state.pos=end+2; return true;
  });
}
let md=null;
if(window.markdownit){
  md=window.markdownit({html:false,linkify:true,typographer:true});
  md.use(underlinePlugin);
  md.renderer.rules.fence=function(tokens,idx){
    const token=tokens[idx], info=(token.info||'').trim(), lang=info.split(/\s+/g)[0];
    let code;
    if(lang && window.hljs && hljs.getLanguage(lang)){ try{ code=hljs.highlight(token.content,{language:lang,ignoreIllegals:true}).value; }catch(e){ code=escapeHtml(token.content); } }
    else code=escapeHtml(token.content);
    return `<pre class="hljs"><code class="language-${escapeHtml(lang)}">${code}</code></pre>\n`;
  };
}
function renderMd(src){ if(md){ try{ return md.render(src); }catch(e){} } return '<pre class="garbage">'+escapeHtml(src)+'</pre>'; }

/* time */
function trimNum(n,d){ return String(Number(n.toFixed(d))); }
function fmtTime(ms){
  if(!isFinite(ms)||ms<=0) return '0 ms';
  if(ms>=10000) return trimNum(ms/1000,2)+' s';
  if(ms>=10) return Math.round(ms)+' ms';
  return trimNum(ms,3)+' ms';
}
function setLastDecrypt(ms){ const b=$('brand'); if(b) b.textContent='上次解密: '+fmtTime(ms); }

/* key store */
const IDB_NAME='en-keys',IDB_STORE='keys',IDB_KEY='aes',IDB_TOKEN='token';
function idbOpen(){ return new Promise((res,rej)=>{ const r=indexedDB.open(IDB_NAME,1); r.onupgradeneeded=()=>r.result.createObjectStore(IDB_STORE); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
async function idbGet(k){ try{ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readonly').objectStore(IDB_STORE).get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return null; } }
async function idbPut(k,v){ const db=await idbOpen(); return await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).put(v,k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }
async function idbDel(k){ try{ const db=await idbOpen(); await new Promise((res,rej)=>{ const q=db.transaction(IDB_STORE,'readwrite').objectStore(IDB_STORE).delete(k); q.onsuccess=()=>res(); q.onerror=()=>rej(q.error); }); }catch(e){} }

/* toast */
let toastTimer=null;
function showToast(msg){ const t=$('toast'); if(!t) return; t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),4000); }

/* nav / page */
function renderNav(){
  const nav=$('nav'); nav.innerHTML='';
  if(!state||!state.nav) return;
  const add=(items,depth)=>{
    for(const it of items){
      const a=document.createElement('a'); a.href='#'+it.id; a.dataset.id=it.id;
      a.className='nav-link'+(it.id===currentId?' active':'');
      a.style.paddingLeft=(9+depth*14)+'px'; a.textContent=it.title;
      nav.appendChild(a);
      if(it.children) add(it.children,depth+1);
    }
  };
  add(state.nav,0);
}
function renderPage(id){
  if(!state||!state.pages){ $('content').innerHTML='<pre class="garbage">（解密失败）</pre>'; return; }
  if(!state.pages[id]) id=state.nav[0]&&state.nav[0].id;
  currentId=id;
  $('pageTitle').textContent=state.pages[id]?id:'';
  if(garbageIds.has(id)) $('content').innerHTML='<pre class="garbage">'+escapeHtml(state.pages[id])+'</pre>';
  else $('content').innerHTML=renderMd(state.pages[id]||'*(空)*');
  renderNav();
}
function enterApp(){
  const id=(location.hash||'').replace(/^#\/?/,'')||(state.nav[0]&&state.nav[0].id);
  if(id) renderPage(id); else $('content').innerHTML='<p style="color:var(--muted)">（还没有笔记，去 <a href="edit.html">编辑页</a> 新建）</p>';
}

/* load all notes from remote */
async function loadAll(){
  const t0=performance.now();
  const man=await S.readManifest();
  let list;
  if(man && Array.isArray(man.notes)){ list=man.notes.map(p=>({path:p})); }
  else { list=(await S.remoteNotes(token, true)).map(e=>({path:e.path})); }
  garbageIds=new Set();
  const notes={}; let garbage=null, parsed=0; const orderCounter={};
  for(const e of list){
    const segs=S.segmentsFromPath(e.path);
    const chain=[];
    for(const seg of segs){ chain.push((await S.decryptName(seg))||{id:seg,title:seg}); }
    if(!chain.length) continue;
    const self=chain[chain.length-1];
    const anc=chain.slice(0,-1).map(c=>c.id);
    const parent=anc.length?anc[anc.length-1]:'';
    const order=(orderCounter[parent]=(orderCounter[parent]||0)+1)-1;
    try{
      const dec=await S.decryptText((await S.fetchNote(e.path)).trim());
      const p=S.parseNote(dec);
      if(!p){ if(garbage===null) garbage=dec; garbageIds.add(self.id); notes[self.id]={id:self.id,title:self.title,content:dec,order,ancestors:anc}; continue; }
      parsed++;
      notes[self.id]={id:self.id,title:self.title,content:p.content,order:p.order,ancestors:anc};
    }catch(err){ console.warn('跳过',e.path,err); }
  }
  state={nav:S.buildNav(notes),pages:{}};
  Object.values(notes).forEach(n=>{ state.pages[n.id]=n.content||''; });
  if(parsed>0) await S.cachePut('state',state);
  return {ms:performance.now()-t0, garbage, parsed};
}
function showGarbage(text){
  $('pageTitle').textContent='';
  $('content').innerHTML='<pre class="garbage">'+escapeHtml(text)+'</pre>';
  const nav=$('nav'); if(nav) nav.innerHTML='';
}

/* garbage modal */
let garbageTimer=null;
function scheduleGarbage(){ clearTimeout(garbageTimer); garbageTimer=setTimeout(()=>{ const m=$('garbageModal'); if(m) m.classList.remove('hidden'); },2000); }
function copyText(t){ if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(t); return new Promise((res,rej)=>{ try{ const ta=document.createElement('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); res(); }catch(e){ rej(e); } }); }
if($('garbageClose')) $('garbageClose').onclick=async()=>{ clearTimeout(garbageTimer); $('garbageModal').classList.add('hidden'); try{ await copyText('password'); showToast('密码已复制: password'); }catch(e){ showToast('复制失败，请手动输入: password'); } };

/* unlock */
$('unlockForm').onsubmit=async(e)=>{
  e.preventDefault();
  const pw=$('pw').value;
  if(!pw){ $('unlockMsg').textContent='请输入密码'; $('unlockMsg').className='unlock-msg err'; return; }
  $('btnUnlock').disabled=true; $('pw').disabled=true; $('unlockMsg').textContent='';
  $('arrowIcon').classList.add('hidden'); $('spinIcon').classList.remove('hidden');
  $('unlockStatus').classList.remove('hidden'); $('unlockStatus').textContent='Generate key…';
  const t0=performance.now();
  try{
    await S.loadParams();
    const key=await S.deriveKey(pw);
    $('unlockStatus').textContent='Fetch notes…';
    try{ await idbPut(IDB_KEY,key); }catch(err){}
    { const t=await idbGet(IDB_TOKEN); token=t||''; }
    const res=await loadAll();
    $('unlock').classList.add('hidden'); $('app').classList.remove('hidden');
    setLastDecrypt(res.ms);
    garbageMode=(res.parsed===0 && res.garbage!==null);
    if(garbageMode) scheduleGarbage(); else showToast('已解密');
    enterApp();
  }catch(err){
    $('arrowIcon').classList.remove('hidden'); $('spinIcon').classList.add('hidden'); $('unlockStatus').classList.add('hidden');
    $('pw').disabled=false; $('btnUnlock').disabled=false;
    $('unlockMsg').textContent='解密失败：'+err.message; $('unlockMsg').className='unlock-msg err';
  }
};

/* lock / edit / hashchange */
$('btnLock').onclick=async()=>{ clearTimeout(garbageTimer); await idbDel(IDB_KEY); location.reload(); };
$('btnEdit').onclick=()=>{ if(garbageMode){ showToast('解密异常，无法编辑'); return; } location.href='edit.html'+(currentId?'#'+encodeURIComponent(currentId):''); };
$('menu').onclick=()=>{ $('sidebar').classList.toggle('open'); $('scrim').classList.toggle('show'); };
$('scrim').onclick=()=>{ $('sidebar').classList.remove('open'); $('scrim').classList.remove('show'); };
window.addEventListener('hashchange',()=>{ if(state) renderPage((location.hash||'').replace(/^#\/?/,'')); });

/* theme */
(function(){
  const K='en-theme';
  const get=()=>localStorage.getItem(K)||'dark';
  const apply=p=>{ const d=p==='dark'||(p==='system'&&matchMedia('(prefers-color-scheme:dark)').matches); document.documentElement.classList.toggle('dark',d); const hl=$('hljsDark'); if(hl) hl.disabled=!d; };
  apply(get());
  ['theme-toggle','theme-toggle-unlock'].forEach(id=>{ const el=$(id); if(el) el.onclick=()=>{ const n=get()==='dark'?'light':'dark'; localStorage.setItem(K,n); apply(n); }; });
})();

/* auto-unlock with cached key */
(async function(){
  try{
    await S.loadParams();
    const k=await idbGet(IDB_KEY);
    if(!k) return;
    S.setKey(k);
    { const t=await idbGet(IDB_TOKEN); token=t||''; }
    const t0=performance.now();
    const cached=await S.cacheGet('state');
    if(cached && cached.nav && cached.nav.length){
      garbageMode=false; state=cached;
      $('unlock').classList.add('hidden'); $('app').classList.remove('hidden');
      setLastDecrypt(performance.now()-t0); showToast('已自动解密 · '+fmtTime(performance.now()-t0)); enterApp();
      loadAll().then(()=>{ enterApp(); }).catch(()=>{});
    } else {
      const res=await loadAll();
      $('unlock').classList.add('hidden'); $('app').classList.remove('hidden');
      setLastDecrypt(res.ms);
      garbageMode=(res.parsed===0 && res.garbage!==null);
      if(garbageMode) scheduleGarbage(); else showToast('已自动解密 · '+fmtTime(res.ms));
      enterApp();
    }
  }catch(e){ console.warn('自动解锁失败',e); }
})();
</script>
